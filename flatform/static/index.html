<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flatform · 내 사업장 지원사업 자격 진단</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1a1d21; --muted: #6b727d;
      --line: #e4e7ec; --brand: #2563eb; --brand-ink: #ffffff;
      --ok-bg: #e7f6ec; --ok-ink: #1b7a3e;
      --unknown-bg: #fdf3d8; --unknown-ink: #8a6d1a;
      --no-bg: #fbe7e9; --no-ink: #b23742;
      --closed-bg: #eceef1; --closed-ink: #6b727d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 19px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .wrap {
      max-width: 1080px; margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start;
    }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px;
    }
    .card h2 { margin: 0 0 16px; font-size: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
    label .hint { font-weight: 400; color: var(--muted); }
    input, select {
      width: 100%; padding: 9px 11px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    input:focus, select:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 15px; font-weight: 700;
      background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .traits { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
    .cb { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; font-size: 13px; }
    .cb input { width: auto; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 14px; }

    .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
    }
    .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .chip.unknown { background: var(--unknown-bg); color: var(--unknown-ink); }
    .chip.no { background: var(--no-bg); color: var(--no-ink); }
    .chip.closed { background: var(--closed-bg); color: var(--closed-ink); }

    .result {
      border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px;
      border-left: 4px solid var(--line);
    }
    .result.ok { border-left-color: var(--ok-ink); }
    .result.unknown { border-left-color: var(--unknown-ink); }
    .result.no { border-left-color: var(--no-ink); }
    .result.closed { border-left-color: var(--closed-ink); opacity: 0.72; }
    .result .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .result .title { font-weight: 700; font-size: 15px; }
    .result .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .badge.unknown { background: var(--unknown-bg); color: var(--unknown-ink); }
    .badge.no { background: var(--no-bg); color: var(--no-ink); }
    .badge.closed { background: var(--closed-bg); color: var(--closed-ink); }
    .dday { font-size: 12px; font-weight: 700; }
    .reasons { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .reasons li { padding: 2px 0 2px 18px; position: relative; color: #3d434b; }
    .reasons li.x::before { content: "✗"; position: absolute; left: 0; color: var(--no-ink); }
    .reasons li.q::before { content: "?"; position: absolute; left: 0; color: var(--unknown-ink); font-weight: 700; }
    .reasons li.o::before { content: "✓"; position: absolute; left: 0; color: var(--ok-ink); }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <header>
    <h1>내 사업장 지원사업 자격 진단</h1>
    <p>프로필을 입력하면 지금 신청 가능한 정부·지자체 지원사업을 자격 판정 사유와 함께 알려드립니다.</p>
  </header>

  <div class="wrap">
    <form class="card" id="form">
      <h2>내 사업장 정보</h2>

      <label>상호 <span class="hint">(선택)</span></label>
      <input name="name" placeholder="예: 마포 김서방 카페">

      <div class="row2">
        <div>
          <label>지역</label>
          <select name="region" required>
            <option value="서울">서울</option><option value="부산">부산</option>
            <option value="대구">대구</option><option value="인천">인천</option>
            <option value="광주">광주</option><option value="대전">대전</option>
            <option value="울산">울산</option><option value="세종">세종</option>
            <option value="경기">경기</option><option value="강원">강원</option>
            <option value="충북">충북</option><option value="충남">충남</option>
            <option value="전북">전북</option><option value="전남">전남</option>
            <option value="경북">경북</option><option value="경남">경남</option>
            <option value="제주">제주</option>
          </select>
        </div>
        <div>
          <label>업종</label>
          <input name="industry" required placeholder="예: 음식점업, 제조업" list="industries">
          <datalist id="industries">
            <option>음식점업</option><option>도소매업</option><option>제조업</option>
            <option>건설업</option><option>운수업</option><option>정보통신업</option>
            <option>서비스업</option>
          </datalist>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>업력 <span class="hint">(년)</span></label>
          <input name="years_in_business" type="number" min="0" step="0.5" value="0" required>
        </div>
        <div>
          <label>상시근로자 <span class="hint">(명)</span></label>
          <input name="employees" type="number" min="0" step="1" value="0" required>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>연 매출 <span class="hint">(만원, 선택)</span></label>
          <input name="annual_revenue_man" type="number" min="0" step="100" placeholder="미입력">
        </div>
        <div>
          <label>대표자 나이 <span class="hint">(만, 선택)</span></label>
          <input name="age" type="number" min="0" step="1" placeholder="미입력">
        </div>
      </div>

      <label>기업 특성 <span class="hint">(해당되면 체크, 선택)</span></label>
      <div class="traits">
        <label class="cb"><input type="checkbox" name="trait" value="사회적기업"> 사회적기업</label>
        <label class="cb"><input type="checkbox" name="trait" value="여성기업"> 여성기업</label>
        <label class="cb"><input type="checkbox" name="trait" value="장애인기업"> 장애인기업</label>
        <label class="cb"><input type="checkbox" name="trait" value="마을기업"> 마을기업</label>
        <label class="cb"><input type="checkbox" name="trait" value="협동조합"> 협동조합</label>
        <label class="cb"><input type="checkbox" name="trait" value="1인창조기업"> 1인창조기업</label>
      </div>

      <button type="submit">지원사업 진단하기</button>
      <p class="meta" id="meta">공고 정보를 불러오는 중…</p>
    </form>

    <div>
      <div class="summary" id="summary"></div>
      <div id="results">
        <div class="card empty">왼쪽에서 사업장 정보를 입력하고 <b>진단하기</b>를 눌러주세요.</div>
      </div>
    </div>
  </div>

  <script>
    const VERDICT_CLASS = { "적합": "ok", "판단보류": "unknown", "부적합": "no", "접수마감": "closed" };

    fetch("/api/meta").then(r => r.json()).then(m => {
      document.getElementById("meta").textContent =
        `현재 공고 ${m.count}건 (${m.source}) 기준으로 진단합니다.`;
    }).catch(() => {});

    function ddayText(d) {
      if (!d) return "";
      if (d.d_day === null) return "상시 접수";
      if (d.d_day < 0) return `${d.label} 마감`;
      return `~${d.label} (D-${d.d_day})`;
    }

    function renderSummary(summary) {
      const order = [["적합","ok"],["판단보류","unknown"],["부적합","no"],["접수마감","closed"]];
      const el = document.getElementById("summary");
      el.innerHTML = order
        .filter(([k]) => summary[k])
        .map(([k, c]) => `<span class="chip ${c}">${k} ${summary[k]}</span>`).join("");
    }

    function renderResults(results) {
      const box = document.getElementById("results");
      if (!results.length) { box.innerHTML = `<div class="card empty">해당하는 공고가 없습니다.</div>`; return; }
      box.innerHTML = results.map(r => {
        const c = VERDICT_CLASS[r.verdict] || "closed";
        let reasons = "";
        if (r.failed.length) reasons += r.failed.map(t => `<li class="x">${esc(t)}</li>`).join("");
        if (r.unknown.length) reasons += r.unknown.map(t => `<li class="q">${esc(t)}</li>`).join("");
        if (r.verdict === "적합" && r.passed.length)
          reasons += r.passed.map(t => `<li class="o">${esc(t)}</li>`).join("");
        const title = r.url
          ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title);
        return `<div class="result ${c}">
          <div class="top">
            <div>
              <div class="title">${title}</div>
              <div class="sub">${esc(r.organ)} · ${esc(r.category)} · <span class="dday">${esc(ddayText(r.deadline))}</span></div>
            </div>
            <span class="badge ${c}">${esc(r.verdict)}</span>
          </div>
          ${reasons ? `<ul class="reasons">${reasons}</ul>` : ""}
        </div>`;
      }).join("");
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const manwon = f.annual_revenue_man.value;
      const traits = Array.from(f.querySelectorAll('input[name="trait"]:checked')).map(c => c.value);
      const payload = {
        name: f.name.value,
        region: f.region.value,
        industry: f.industry.value,
        years_in_business: f.years_in_business.value,
        employees: f.employees.value,
        annual_revenue: manwon === "" ? null : Math.round(Number(manwon) * 10000),
        age: f.age.value === "" ? null : f.age.value,
        business_traits: traits,
      };
      const btn = f.querySelector("button");
      btn.disabled = true; btn.textContent = "진단 중…";
      try {
        const res = await fetch("/api/match", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        renderSummary(data.summary);
        renderResults(data.results);
      } catch (err) {
        alert("진단 중 오류가 발생했습니다: " + err);
      } finally {
        btn.disabled = false; btn.textContent = "지원사업 진단하기";
      }
    });
  </script>
</body>
</html>
